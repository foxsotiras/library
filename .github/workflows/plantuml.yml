name: Render PlantUML

on:
  push:
    branches:
      - main
    paths:
      - 'docs/src/**/*.puml'
      - '.github/workflows/plantuml.yml'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'docs/src/**/*.puml'
      - '.github/workflows/plantuml.yml'

permissions:
  contents: read

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-slim

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Java и зависимости
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-dejavu-core

      # 3. Установка PlantUML
      - name: Install PlantUML
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.2026.10"

          curl -fL --retry 3 \
            -o /tmp/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${VERSION}/plantuml-${VERSION}.jar"

          java -jar /tmp/plantuml.jar -version

      # 4. Проверка синтаксиса
      - name: Validate PlantUML
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d docs/src ]; then
            echo "Error: docs/src not found"
            exit 1
          fi

          mapfile -d '' files < <(
            find docs/src -type f -name '*.puml' -print0
          )

          if [ ! -d docs/src ]; then
            echo "No source directory found, cleanup will remove obsolete images"
            exit 0
          fi

          # Запрет Rel_*, Lay_* и skinparam
          if grep -nEi \
            '(^|[^[:alnum:]_])(Rel_|Lay_)[[:alnum:]_]*|(^|[^[:alnum:]_])skinparam([^[:alnum:]_]|$)' \
            "${files[@]}"; then

            echo "Error: Forbidden syntax"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Checking: $file"

            if ! java -jar /tmp/plantuml.jar \
              --check-syntax "$file"; then

              echo "Syntax error: $file"
              exit 1
            fi
          done

          echo "Validation successful"

      # 5. Генерация изображений
      - name: Render diagrams
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/images

          while IFS= read -r -d '' file; do
            relative="${file#docs/src/}"
            directory="$(dirname "$relative")"
            filename="$(basename "$file" .puml)"

            output="docs/images/$directory"

            mkdir -p "$output"
            output="$(realpath "$output")"

            echo "Rendering: $file"

            for format in png svg; do
              echo "Generating $format..."

              if ! java -jar /tmp/plantuml.jar \
                --format "$format" \
                --output-dir "$output" \
                "$file"; then

                echo "Render failed: $file ($format)"
                exit 1
              fi

              expected="$output/$filename.$format"

              if [ ! -s "$expected" ]; then
                echo "Output not found: $expected"
                ls -lah "$output"
                exit 1
              fi

              echo "Generated: $expected"
            done

          done < <(
            find docs/src -type f -name '*.puml' -print0
          )

          echo "Rendering completed"

      # 6. Удаление изображений без исходных .puml
      - name: Cleanup obsolete diagrams
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for obsolete diagrams..."

          if [ ! -d docs/images ]; then
            echo "No generated images directory"
            exit 0
          fi

          while IFS= read -r -d '' image; do
            # Относительный путь изображения
            relative="${image#docs/images/}"

            # Восстанавливаем путь исходного .puml
            source="docs/src/${relative%.*}.puml"

            # Если исходника нет — удаляем рендер
            if [ ! -f "$source" ]; then
              echo "Removing obsolete image: $image"
              rm -- "$image"
            fi

          done < <(
            find docs/images -type f \
              \( -name '*.png' -o -name '*.svg' \) \
              -print0
          )

          # Удаляем пустые поддиректории
          find docs/images \
            -mindepth 1 \
            -depth \
            -type d \
            -empty \
            -delete

          echo "Cleanup completed"

      # 7. Получение токена GitHub App
      # Только для push в main
      - name: Generate GitHub App token
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # 8. Создание отдельного коммита
      - name: Commit generated diagrams
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          git add -A -- docs/images/

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          # Получаем GitHub ID бота для корректного email
          BOT_NAME="${APP_SLUG}[bot]"

          BOT_ID=$(gh api \
            "/users/${BOT_NAME}" \
            --jq '.id')

          BOT_EMAIL="${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

          # Настраиваем автора
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

          # Создаём новый коммит
          git commit -m "docs: generate PlantUML diagrams"

          # Настраиваем аутентификацию Git через App
          gh auth setup-git

          # Обычный push в main
          git push origin HEAD:main

          echo "Diagrams committed successfully"
